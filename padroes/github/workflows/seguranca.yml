name: Segurança

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"

# actions: read é exigido pelo CodeQL em repositório privado (consulta a execução do workflow).
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ajuste por repositório: javascript-typescript (autvs_app) ou csharp (autvs_api).
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  # Substitui o dependency-review-action, que exige GitHub Advanced Security em repositório privado.
  # Só roda onde há package-lock.json; vulnerabilidade alta ou crítica barra o PR.
  auditoria-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hashFiles() só é permitido em passos (não no if do job).
      - if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high
